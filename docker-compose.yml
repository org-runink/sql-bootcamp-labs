# Works with EITHER runtime — pick one and stick to it:
#
#     podman-compose up -d      (recommended, rootless, no licence tier)
#     docker compose up -d      (if Podman is giving you trouble)
#
# DO NOT RUN BOTH. They fight over ports 3306 and 8888, and the loser fails
# with "address already in use" — usually the Jupyter console, which then sits
# in "Created" and never starts while the database looks fine. If you switch
# runtimes, stop the other one first:
#     podman-compose down       (before using docker)
#     docker compose down       (before using podman)
#
# The filename stays `docker-compose.yml` because that is what BOTH tools look
# for by default. The Compose file format is an open spec; the name is history.

services:
  mysql:
    # Fully qualified on purpose. Rootless Podman ships no default registry
    # list, so a short name like `mysql:latest` fails with
    # "short-name did not resolve to an alias" instead of silently guessing
    # which registry you meant.
    image: docker.io/library/mysql:latest
    container_name: mysql-lan
    restart: unless-stopped
    # local_infile is OFF by default in MySQL 8+. Worksheet 01 teaches
    # LOAD DATA LOCAL INFILE, so the server has to allow it or that whole
    # exercise is unrunnable. The client must opt in too — the notebooks
    # connect with ?local_infile=1.
    command: --local-infile=1
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  sql-console:
    build: ./jupyter-sql
    # A stale image is the failure the build-time gate cannot catch:
    # `up -d` without --build reuses whatever is tagged, and this image
    # was SQL-only (no pandas) until commit c4082db. This surfaces that
    # as `unhealthy` in `podman ps`, with no script to remember.
    healthcheck:
      test: ["CMD", "python3", "/opt/verify_image.py"]
      interval: 60s
      timeout: 20s
      retries: 2
      start_period: 30s
    container_name: sql-console-lan
    restart: unless-stopped
    command: start-notebook.py --ServerApp.token='' --ServerApp.password=''
    # Rootless Podman maps your host user to a *different* UID inside the
    # container, so the ./exercises bind mount below would be read-only to
    # Jupyter and saving a notebook would fail with "Permission denied".
    # keep-id maps your host user onto jovyan (uid 1000, gid 100 = `users`),
    # which is who the JupyterLab image runs as, restoring write access.
    # Running under Docker instead? Delete this one line.
    userns_mode: "keep-id:uid=1000,gid=100"
    ports:
      - "0.0.0.0:8888:8888"
    volumes:
      - sql-console-work:/home/jovyan/work
      # Mount each class's exercises/ -- never the class folder itself, which
      # would duplicate the solutions under a second path.
      - ./week2_day2_afternoon/exercises:/home/jovyan/work/week2_day2_afternoon
      - ./week2_day3_morning/exercises:/home/jovyan/work/week2_day3_morning
      # 26/08 is Python, not SQL -- it needs no database, but it lives in the
      # same console so students open it the same way as every other sheet.
      - ./week2_day4_afternoon/exercises:/home/jovyan/work/week2_day4_afternoon
      # 27/08 is Python too -- control flow and iteration. Also no database.
      - ./week2_day5_morning/exercises:/home/jovyan/work/week2_day5_morning
      # 30/08 is Pandas. Also no database, but it DOES need pandas + openpyxl +
      # pyarrow in the image -- see jupyter-sql/Dockerfile. base-notebook ships
      # none of them, so rebuild the image if these worksheets fail to import.
      - ./week3_day1_afternoon/exercises:/home/jovyan/work/week3_day1_afternoon
      # week 3 day 2 continues Pandas: reshaping (L04) and transformation (L05).
      # Same image requirements as 30/08 -- pandas and friends must be present.
      - ./week3_day2_afternoon/exercises:/home/jovyan/work/week3_day2_afternoon
      # week 3 day 3 is Snowflake. The Snowflake half runs in the student's own
      # account, not here; the worksheets that DO run locally work on the same
      # real CSVs the Snowflake lab ingests.
      - ./week3_day3_afternoon/exercises:/home/jovyan/work/week3_day3_afternoon
      - ./week3_day4_morning/exercises:/home/jovyan/work/week3_day4_morning
      - ./week3_recap/exercises:/home/jovyan/work/week3_recap
      # ANSWERS ARE PUBLISHED TO EVERYONE. This console is shared across the
      # classroom LAN, so mounting solutions/ here means every student can read
      # every answer to every session -- including exercises they have not
      # attempted yet. That is a deliberate choice by the instructor, not an
      # oversight. Delete this one line to go back to answers-in-git-only.
      - ./solutions:/home/jovyan/work/SOLUTIONS
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  sql-console-work:
