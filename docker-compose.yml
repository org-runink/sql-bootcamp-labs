services:
  mysql:
    image: mysql:latest
    container_name: mysql-lan
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  sql-console:
    build: ./jupyter-sql
    container_name: sql-console-lan
    restart: unless-stopped
    command: start-notebook.py --ServerApp.token='' --ServerApp.password=''
    ports:
      - "0.0.0.0:8888:8888"
    volumes:
      - sql-console-work:/home/jovyan/work
      - ./exercises:/home/jovyan/work/exercises
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  sql-console-work:
