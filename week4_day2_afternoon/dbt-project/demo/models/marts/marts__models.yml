# PROPERTIES FILE for the marts layer.
#
# Three jobs, worth separating in your head:
#
#   description:  documentation, surfaced by `dbt docs`
#   config:       CONFIGURATION -- the SECOND of the three ways to configure a
#                 model (see the notebook question on precedence)
#   tests:        data quality
#
# The tests here are dbt's four built-in generics plus TWO WE WROTE OURSELVES --
# row_count_between and column_between, in tests/generic/. Those replace the
# dbt-expectations equivalents so the project needs no packages: code running
# inside Snowflake has no outbound internet by default, so `dbt deps` cannot
# reach the dbt Hub and a project that REQUIRES a package will not build.
#
# NOTE: dbt renders .yml as Jinja BEFORE parsing, and that includes '#' comment
# lines -- so describe Jinja in words in comments; use it for real in values.

version: 2

models:
  # ------------------------------------------------------------------------
  # Configured HERE, in YAML, rather than with a config() block in the .sql.
  # Same effect; the choice is about where the knob lives. Config in YAML keeps
  # the model file pure SELECT and puts materialization, tags and docs settings
  # next to the description and tests they belong with.
  # ------------------------------------------------------------------------
  - name: rpt_sales_by_region
    description: "Sales by region, month and (current) category — the main dashboard feed."
    config:
      materialized: table          # overrides the folder default in dbt_project.yml
      tags: ['marts', 'dashboard', 'daily']
      persist_docs:
        relation: true             # push the description into Snowflake as a COMMENT
        columns: true
    tests:
      # SHAPE -- our own model-level test. Catches the report silently coming
      # back empty, which no column-level test can see.
      - row_count_between:
          arguments:
            min_value: 1
    columns:
      - name: region
        tests:
          - not_null
          # SET -- dbt's built-in accepted_values does what
          # expect_column_values_to_be_in_set did.
          - accepted_values:
              arguments:
                values: ['East', 'West', 'Central', 'North', 'South']
      - name: sales_qty
        tests:
          # RANGE -- our own column_between. Quantities are never negative.
          - column_between:
              arguments:
                min_value: 0
      - name: sales_amt
        tests:
          - not_null

  - name: rpt_category_vs_target
    description: "Actual sales against the planning target from the category_targets seed."
    config:
      materialized: table
      tags: ['marts', 'finance']
      persist_docs:
        relation: true
    columns:
      - name: category_name
        tests:
          - unique
          - not_null
      - name: target_status
        tests:
          - accepted_values:
              arguments:
                values: ['MET', 'MISSED']
      - name: pct_of_target
        tests:
          # A sanity band: a category at 0% or 10,000% of target means the join
          # or the seed is wrong, not that the business had a great quarter.
          - column_between:
              arguments:
                min_value: 0
                max_value: 1000

  - name: rpt_category_pivot
    description: "Sales amount per store, one column per category (generated by a Jinja macro)."
    config:
      materialized: table
      tags: ['marts', 'dashboard']
    columns:
      - name: store_key
        tests:
          - unique
          - not_null
