# Spark defaults for a small workstation (~8 GB RAM), not a cluster.
#
# WHY A FILE, AND HOW IT INTERACTS WITH builder.config()
# ------------------------------------------------------
# spark.driver.memory is fixed when the JVM is LAUNCHED. In local mode the
# driver is also the executor, so it is the memory setting that matters.
#
# Measured in this image, all three cases:
#
#   1. no override, this file present
#        -> heap 2.00 GB. The file is the baseline.
#
#   2. builder.config("spark.driver.memory","6g") as the FIRST session in a
#      fresh Python process
#        -> heap 6.00 GB. PySpark passes it to spark-submit before the JVM
#           starts, so the builder DOES win here.
#
#   3. the same builder.config on a SECOND session, after one already exists
#        -> heap stays 2.00 GB. The JVM is already up. Worse, spark.conf.get
#           then reports "2g" rather than the 6g that was asked for, so the
#           request vanishes without a trace.
#
# So: to give Spark more memory in a notebook, set it on the FIRST
# getOrCreate() of the session -- and if a session already exists, restart the
# kernel first. Changing it afterwards silently does nothing.
#
# THE BUDGET
# ----------
# On an 8 GB machine the OS and a browser take ~3 GB, JupyterLab and its kernel
# ~0.5 GB, and the mysql container ~0.5 GB. That leaves roughly 4 GB. Spark
# gets 2 GB of it, which keeps a swap-storm off the table when a student
# collects a bigger DataFrame than they meant to.
#
# Raise these on a bigger machine -- see the console section of the top-level
# README for how.

# ---- memory -----------------------------------------------------------------
# The driver IS the executor in local mode. 2 GB of the ~4 GB available.
spark.driver.memory                 2g

# A runaway .collect() or .toPandas() pulls the whole result into the driver.
# Without a cap that is an OOM and a dead kernel; with one it is an error
# message naming the setting.
spark.driver.maxResultSize          512m

# ---- parallelism ------------------------------------------------------------
# Two threads, so the browser and JupyterLab stay responsive while a job runs.
# On a machine with cores to spare, local[4] or local[*] is fine.
spark.master                        local[2]

# THE DEFAULT HERE IS 200, AND IT IS THE WORST DEFAULT ON A LAPTOP. Every
# shuffle -- every join, groupBy, distinct, orderBy -- creates 200 partitions.
# On a 10,000-row teaching dataset that is 200 tasks of 50 rows each, 200 files
# written, and scheduling overhead that dwarfs the work. Match it to the cores.
spark.sql.shuffle.partitions        8
spark.default.parallelism           8

# ---- adaptive query execution -----------------------------------------------
# Both already default to true in Spark 4; stated explicitly so a future
# default change does not quietly alter behaviour. AQE coalesces those shuffle
# partitions at runtime, which is the safety net under the number above.
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true

# ---- serialization ----------------------------------------------------------
# Kryo is smaller and faster than Java serialization. Memory is the binding
# constraint here, so it is worth the one line.
spark.serializer                    org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max     256m

# ---- noise ------------------------------------------------------------------
# Local mode has one executor and nothing to lose.
spark.shuffle.service.enabled       false

# ---- event log, for the history server --------------------------------------
# The live UI on :4040 exists only while a SparkContext is alive -- close the
# notebook and the DAG you wanted to show the class is gone. Event logs are what
# the history server on :18080 replays afterwards.
#
# The directory is a named volume shared with the spark-history service, so both
# containers see the same files.
spark.eventLog.enabled              true
spark.eventLog.dir                  file:///home/jovyan/spark-events
spark.eventLog.compress             true
spark.history.fs.logDirectory       file:///home/jovyan/spark-events

# One log file per application, forever, is a slow disk leak on a teaching
# machine. Keep a week.
spark.history.fs.cleaner.enabled    true
spark.history.fs.cleaner.interval   1d
spark.history.fs.cleaner.maxAge     7d

# NOT SET, deliberately:
#
#   spark.sql.execution.arrow.pyspark.enabled
#       already true in Spark 4, and left alone. Arrow makes toPandas() far
#       cheaper in both time and memory, which matters most on the small
#       machine this file is for. Note that PySpark 4.2 warns it "does not yet
#       fully support pandas >= 3.0.0" and this image pins pandas 3.0.5 -- so
#       toPandas(), pandas UDFs and pandas-on-Spark are the paths to distrust.
#
#   spark.ui.enabled
#       left at its default (on). Published on :4040 by docker-compose.yml,
#       alongside the history server on :18080.
